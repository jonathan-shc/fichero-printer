connect:
  name: Connect
  description: Press the configured SwitchBot (if any) and open a Bluetooth session.
  fields:
    config_entry_id:
      name: Printer configuration
      required: true
      selector:
        config_entry:
          integration: fichero_printer
disconnect:
  name: Disconnect
  description: Close the Bluetooth session and stop reconnecting automatically until the next print. Presses the SwitchBot if configured to.
  fields:
    config_entry_id:
      name: Printer configuration
      required: true
      selector:
        config_entry:
          integration: fichero_printer
print_label:
  name: Print label
  description: Fit text, icons, emoji, QR codes and barcodes on a label and print it, connecting first when needed.
  fields:
    config_entry_id:
      name: Printer configuration
      required: true
      selector:
        config_entry:
          integration: fichero_printer
    text:
      name: Text
      description: "Label text. Inline tokens: [mdi:fridge] or [m3o:kitchen] for icons, [qr:https://…] for a QR code, [barcode:12345] for a Code 128 barcode. Emoji are supported."
      required: true
      example: "[mdi:fridge] Milk"
      selector:
        text:
          multiline: true
    copies:
      name: Copies
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    multiline:
      name: Multiline
      description: Keep typed line breaks and print each line on its own row, wrapping only lines that would get too small.
      default: false
      selector:
        boolean:
save_favorite:
  name: Save favorite
  description: Save label text as a shortcut on the dashboard card.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: fichero_printer
    text:
      required: true
      selector:
        text:
delete_favorite:
  name: Delete favorite
  description: Remove a saved label shortcut.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: fichero_printer
    index:
      name: Favorite position
      description: Zero-based position used by the dashboard card.
      required: false
      selector:
        number:
          min: 0
          mode: box
    text:
      name: Favorite text
      description: Text value retained for existing automations.
      required: false
      selector:
        text:
